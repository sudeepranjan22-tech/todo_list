<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>📝 To-Do List</h1>

    <form action="/add" method="post" class="task-form">
        <input type="text" name="task_name" placeholder="Task name" required>
        <input type="text" name="description" placeholder="Description">
        <input type="text" name="person" placeholder="Person">
        <select name="status">
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
        </select>
        <button type="submit">Add Task</button>
    </form>

    {% if tasks %}
    <table class="task-table">
        <thead>
            <tr>
                <th>Task</th>
                <th>Description</th>
                <th>Person</th>
                <th>Status</th>
                <th>Created</th>
                <th>Updated</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ task.task_name }}</td>
                <td>{{ task.description }}</td>
                <td>{{ task.person }}</td>
                <td><span class="status {{ task.status }}">{{ task.status }}</span></td>
                <td>{{ task.created_at }}</td>
                <td>{{ task.updated_at }}</td>
                <td>
                    <a href="/edit/{{ task.task_id }}">✏</a>
                    <form action="/delete/{{ task.task_id }}" method="post" style="display:inline;">
                        <button type="submit" title="Delete" onclick="return confirm('Delete this task?')">🗑</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No tasks found.</p>
    {% endif %}
</body>
</html>
